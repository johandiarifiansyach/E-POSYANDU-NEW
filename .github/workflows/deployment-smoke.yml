name: Deployment Smoke Test

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read

concurrency:
  group: production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm run deployment:smoke
        env:
          SMOKE_FRONTEND_URL: https://e-posyandu.pages.dev
          SMOKE_API_URL: https://e-posyandu-api.eposyandu-puskesmas-gumukmas.workers.dev
          SMOKE_REQUIRE_SECURITY_HEADERS: 'true'
          SMOKE_SESSION_COOKIE: ${{ secrets.SMOKE_SESSION_COOKIE }}
