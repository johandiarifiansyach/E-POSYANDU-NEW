name: Build, Test, and Deploy

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, staging]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-17
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            backend
            services/eposyandu-proto
            services/data-processing-service
            services/oracle-api
            services/oracle-domain
            services/identity-service
            services/operations-service
            services/realtime-service
            services/monitoring-service
      - run: npm ci --prefix frontend
      - run: npm ci --prefix services/neon-read-worker
      - run: npm audit --audit-level=high
        working-directory: frontend
      - run: npm audit --audit-level=high
        working-directory: services/neon-read-worker
      - run: npm run check
      - run: npm run build

  end-to-end:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npx playwright install --with-deps chromium webkit
        working-directory: frontend
      - run: npm run e2e:test

  deploy-production:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && vars.AUTO_DEPLOY == 'true'
    needs: [quality, end-to-end]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-17
        with:
          targets: wasm32-unknown-unknown
      - name: Detect changed services
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.before }}"
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            base="$(git rev-parse HEAD^ 2>/dev/null || true)"
          fi
          if [[ -z "$base" ]]; then
            files="$(git ls-files)"
          else
            files="$(git diff --name-only "$base" "$GITHUB_SHA")"
          fi
          emit() {
            local name="$1"
            local pattern="$2"
            if grep -Eq "$pattern" <<<"$files"; then
              echo "$name=true" >> "$GITHUB_OUTPUT"
            else
              echo "$name=false" >> "$GITHUB_OUTPUT"
            fi
          }
          emit database '^database/migrations/'
          emit edge_worker '^(backend/|database/migrations/)'
          emit read_replica '^services/neon-read-worker/'
          emit frontend '^(frontend/|deploy/oracle/frontend/)'
          emit oracle_api '^(services/oracle-api/|services/oracle-domain/|services/(identity|operations|realtime|monitoring)-service/|services/eposyandu-proto/|deploy/oracle/)'
          emit data_processing_worker '^services/(data-processing-service|eposyandu-proto)/'
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: npm ci --prefix frontend
      - run: npm ci --prefix services/neon-read-worker
      - run: cargo install worker-build --locked
        if: steps.changes.outputs.edge_worker == 'true'
      - run: ./scripts/database/migrate.sh
        if: steps.changes.outputs.database == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Deploy private Neon read worker
        if: steps.changes.outputs.read_replica == 'true'
        run: npm run replica:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy Cloudflare edge API
        if: steps.changes.outputs.edge_worker == 'true'
        run: npx --yes wrangler --cwd backend deploy --env=""
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Build frontend
        if: steps.changes.outputs.frontend == 'true'
        run: npm run pages:build
      - name: Deploy frontend Pages
        if: steps.changes.outputs.frontend == 'true'
        run: npx --yes wrangler pages deploy frontend/dist --project-name e-posyandu --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: npm run deployment:smoke
        env:
          SMOKE_FRONTEND_URL: https://e-posyandu.pages.dev
          SMOKE_API_URL: https://api.eposyandu.app
          SMOKE_REQUIRE_SECURITY_HEADERS: 'true'
          SMOKE_SESSION_COOKIE: ${{ secrets.SMOKE_SESSION_COOKIE }}
