name: Encrypted Database Backup

on:
  workflow_dispatch:
    inputs:
      run_restore_drill:
        description: Uji restore ke database non-production setelah backup
        required: true
        type: boolean
        default: false
  schedule:
    - cron: '0 18 * * 6'
    - cron: '0 19 1 * *'

permissions:
  contents: read

concurrency:
  group: database-backup
  cancel-in-progress: false

jobs:
  backup:
    if: github.event_name == 'workflow_dispatch' || vars.ENABLE_SCHEDULED_BACKUP == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    outputs:
      artifact-name: ${{ steps.metadata.outputs.artifact-name }}
      source-fingerprint: ${{ steps.metadata.outputs.source-fingerprint }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install PostgreSQL 17 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/17/bin/pg_dump --version
      - name: Validate backup secrets
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_ENCRYPTION_PASSWORD: ${{ secrets.BACKUP_ENCRYPTION_PASSWORD }}
        run: |
          test -n "$DATABASE_URL" || { echo 'Secret DATABASE_URL belum diisi.' >&2; exit 1; }
          test ${#BACKUP_ENCRYPTION_PASSWORD} -ge 24 || { echo 'BACKUP_ENCRYPTION_PASSWORD minimal 24 karakter.' >&2; exit 1; }
      - name: Create and encrypt backup
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_ENCRYPTION_PASSWORD: ${{ secrets.BACKUP_ENCRYPTION_PASSWORD }}
        run: |
          trap 'rm -f "$RUNNER_TEMP/e-posyandu.dump"' EXIT
          ./scripts/database/backup.sh "$RUNNER_TEMP/e-posyandu.dump"
          ./scripts/database/verify-backup.sh "$RUNNER_TEMP/e-posyandu.dump"
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 \
            -in "$RUNNER_TEMP/e-posyandu.dump" \
            -out "$RUNNER_TEMP/e-posyandu.dump.enc" \
            -pass env:BACKUP_ENCRYPTION_PASSWORD
          rm -f "$RUNNER_TEMP/e-posyandu.dump"
          cd "$RUNNER_TEMP"
          sha256sum e-posyandu.dump.enc > e-posyandu.dump.enc.sha256
      - id: metadata
        name: Record backup metadata
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          echo "artifact-name=e-posyandu-backup-${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"
          source_fingerprint="$(python3 - <<'PY'
          import hashlib
          import os
          from urllib.parse import unquote, urlsplit

          parsed = urlsplit(os.environ["DATABASE_URL"])
          identity = "|".join((
              parsed.hostname or "",
              str(parsed.port or ""),
              unquote(parsed.username or ""),
              parsed.path or "",
          ))
          print(hashlib.sha256(identity.encode("utf-8")).hexdigest())
          PY
          )"
          echo "source-fingerprint=$source_fingerprint" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.metadata.outputs.artifact-name }}
          path: |
            ${{ runner.temp }}/e-posyandu.dump.enc
            ${{ runner.temp }}/e-posyandu.dump.enc.sha256
          if-no-files-found: error
          retention-days: 14

  restore-drill:
    needs: backup
    if: >-
      needs.backup.result == 'success' &&
      ((github.event_name == 'workflow_dispatch' && inputs.run_restore_drill) ||
      (github.event_name == 'schedule' && github.event.schedule == '0 19 1 * *' && vars.ENABLE_MONTHLY_RESTORE_DRILL == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install PostgreSQL 17 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/17/bin/pg_restore --version
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.backup.outputs.artifact-name }}
          path: ${{ runner.temp }}/backup
      - name: Verify, decrypt, and restore
        env:
          RESTORE_DATABASE_URL: ${{ secrets.RESTORE_DATABASE_URL }}
          BACKUP_ENCRYPTION_PASSWORD: ${{ secrets.BACKUP_ENCRYPTION_PASSWORD }}
          CONFIRM_RESTORE_DRILL: RESTORE-TEST
          SOURCE_DATABASE_FINGERPRINT: ${{ needs.backup.outputs.source-fingerprint }}
        run: |
          trap 'rm -f "$RUNNER_TEMP/e-posyandu-restore.dump"' EXIT
          test -n "$RESTORE_DATABASE_URL" || { echo 'Secret RESTORE_DATABASE_URL belum diisi.' >&2; exit 1; }
          test -n "$SOURCE_DATABASE_FINGERPRINT" || { echo 'Fingerprint database produksi tidak tersedia.' >&2; exit 1; }
          target_fingerprint="$(python3 - <<'PY'
          import hashlib
          import os
          from urllib.parse import unquote, urlsplit

          parsed = urlsplit(os.environ["RESTORE_DATABASE_URL"])
          identity = "|".join((
              parsed.hostname or "",
              str(parsed.port or ""),
              unquote(parsed.username or ""),
              parsed.path or "",
          ))
          print(hashlib.sha256(identity.encode("utf-8")).hexdigest())
          PY
          )"
          test "$target_fingerprint" != "$SOURCE_DATABASE_FINGERPRINT" || {
            echo 'Target restore sama dengan database produksi. Restore dibatalkan.' >&2
            exit 1
          }
          cd "$RUNNER_TEMP/backup"
          sha256sum --check e-posyandu.dump.enc.sha256
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in e-posyandu.dump.enc \
            -out "$RUNNER_TEMP/e-posyandu-restore.dump" \
            -pass env:BACKUP_ENCRYPTION_PASSWORD
          cd "$GITHUB_WORKSPACE"
          ./scripts/database/restore-drill.sh "$RUNNER_TEMP/e-posyandu-restore.dump"
          rm -f "$RUNNER_TEMP/e-posyandu-restore.dump"
