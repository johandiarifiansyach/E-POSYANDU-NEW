name: Dependency Security Audit

on:
  workflow_dispatch:
  schedule:
    - cron: '23 19 * * 1'
  pull_request:
    paths:
      - 'backend/Cargo.lock'
      - 'backend/Cargo.toml'
      - 'services/data-processing-service/Cargo.lock'
      - 'services/data-processing-service/Cargo.toml'

permissions:
  contents: read

concurrency:
  group: dependency-security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rustsec:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-17
      - name: Install RustSec cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit Cloudflare API dependencies
        run: cargo audit --file backend/Cargo.lock
      - name: Audit data-processing worker dependencies
        run: cargo audit --file services/data-processing-service/Cargo.lock
