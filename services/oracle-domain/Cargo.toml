[package]
name = "e-posyandu-oracle-domain"
version = "3.7.0"
edition = "2024"
publish = false

[dependencies]
aes-gcm = "0.10"
axum = "0.8"
base64 = "0.22"
deadpool-postgres = "0.14.1"
e-posyandu-proto = { path = "../eposyandu-proto" }
futures-util = "0.3"
hex = "0.4"
rand = "0.8"
redis = { version = "1", default-features = false, features = ["connection-manager", "tokio-comp"] }
reqwest = { version = "0.12", default-features = false, features = ["http2", "json", "rustls-tls", "stream"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-postgres = { version = "0.7.18", features = ["with-serde_json-1"] }
tonic = { version = "0.14", features = ["transport"] }
tracing = "0.1"
url = "2"
uuid = { version = "1", features = ["v4"] }
