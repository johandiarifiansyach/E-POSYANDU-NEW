[package]
name = "e-posyandu-data-processing-service"
version = "3.8.0"
edition = "2024"
publish = false
default-run = "data-processing-worker"

[[bin]]
name = "data-processing-worker"
path = "src/bin/standalone.rs"

[[bin]]
name = "data-processing-cloud"
path = "src/bin/cloud.rs"

[[bin]]
name = "data-processing-load"
path = "src/bin/load.rs"

[dependencies]
e-posyandu-proto = { path = "../eposyandu-proto" }
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
hex = "0.4"
hmac = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rust_xlsxwriter = "0.90"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = "0.14"
tonic-health = "0.14"
tonic-prost = "0.14"
