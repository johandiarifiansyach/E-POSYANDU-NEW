[package]
name = "e-posyandu-mcp-service"
version = "3.8.1"
edition = "2024"
publish = false

[dependencies]
axum = "0.8"
e-posyandu-proto = { path = "../eposyandu-proto" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tonic = { version = "0.14", features = ["transport"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[profile.release]
lto = true
opt-level = "s"
strip = true
codegen-units = 1
