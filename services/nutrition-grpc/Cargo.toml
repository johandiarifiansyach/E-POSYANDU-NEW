[package]
name = "e-posyandu-nutrition-grpc"
version = "4.4.5"
edition = "2024"
publish = false
default-run = "nutrition-grpc-standalone"

[[bin]]
name = "nutrition-grpc-standalone"
path = "src/bin/standalone.rs"

[[bin]]
name = "nutrition-grpc-cloud"
path = "src/bin/cloud.rs"

[dependencies]
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
hex = "0.4"
hmac = "0.12"
prost = "0.14"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rust_xlsxwriter = "0.90"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal"] }
tonic = "0.14"
tonic-health = "0.14"
tonic-prost = "0.14"

[build-dependencies]
protoc-bin-vendored = "3"
tonic-prost-build = "0.14"
