[package]
name = "e-posyandu-cloudflare-worker"
version = "3.4.2"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
hex = "0.4"
hmac = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
url = "2"
worker = "0.8.5"

[profile.release]
lto = true
opt-level = "s"
strip = true
codegen-units = 1
