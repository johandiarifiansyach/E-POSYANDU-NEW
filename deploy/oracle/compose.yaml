name: e-posyandu-oracle

services:
  nutrition-worker:
    build:
      context: ../..
      dockerfile: services/nutrition-grpc/Dockerfile
    image: e-posyandu-nutrition-worker:oracle
    restart: unless-stopped
    env_file:
      - ${ORACLE_NUTRITION_ENV_FILE:-/etc/e-posyandu/nutrition-grpc.env}
    environment:
      GRPC_ADDR: 127.0.0.1:50051
      PORT: "8080"
      QUEUE_BATCH_SIZE: ${QUEUE_BATCH_SIZE:-2}
      QUEUE_POLL_INTERVAL_MS: ${QUEUE_POLL_INTERVAL_MS:-15000}
    expose:
      - "8080"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 2g
    mem_swappiness: 0
    cpus: 0.85
    logging:
      driver: journald

  health-proxy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    depends_on:
      - nutrition-worker
    environment:
      ORACLE_HEALTH_SITE: ${ORACLE_HEALTH_SITE:?ORACLE_HEALTH_SITE wajib diisi}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    logging:
      driver: journald

volumes:
  caddy_data:
  caddy_config:
