name: e-posyandu-oracle

services:
  identity-service:
    build:
      context: ../..
      dockerfile: services/oracle-domain/Dockerfile
      args:
        SERVICE_DIR: identity-service
        SERVICE_BIN: e-posyandu-identity-service
    image: ${IDENTITY_SERVICE_IMAGE:-e-posyandu-identity-service:oracle}
    restart: unless-stopped
    env_file:
      - ${ORACLE_API_VAULT_ENV_FILE:-/run/e-posyandu/oracle-api-vault.env}
    environment:
      IDENTITY_GRPC_ADDR: ${IDENTITY_GRPC_ADDR:-unix:///run/e-posyandu/identity.sock}
      ORACLE_API_NATIVE_AUTH_ENABLED: "true"
      ORACLE_API_NATIVE_CREDENTIAL_MIGRATION_ENABLED: "true"
      ORACLE_API_NATIVE_ADMIN_CREDENTIAL_SHADOW_ENABLED: "true"
      ORACLE_API_NATIVE_ADMIN_SECURITY_SHADOW_ENABLED: "true"
      ORACLE_API_SESSION_DB_PATH: /var/lib/e-posyandu-api/sessions.sqlite
      ORACLE_API_ENVIRONMENT: production
      TURNSTILE_HOSTNAMES: ${ORACLE_API_TURNSTILE_HOSTNAMES:-eposyandu.app}
      CORS_ORIGINS: ${ORACLE_API_CORS_ORIGINS:-https://eposyandu.app,https://www.eposyandu.app}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      CLOUDFLARE_QUEUE_ID: ${CLOUDFLARE_QUEUE_ID:-}
      ORACLE_DATABASE_POOL_SIZE: ${ORACLE_DATABASE_POOL_SIZE:-5}
    expose:
      - "50052"
    volumes:
      - /var/lib/e-posyandu/oracle-api:/var/lib/e-posyandu-api:rw,z
      - /var/lib/e-posyandu/grpc:/run/e-posyandu:rw,z
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    cpus: 0.35
    networks:
      - default
    logging:
      driver: journald

  operations-service:
    build:
      context: ../..
      dockerfile: services/oracle-domain/Dockerfile
      args:
        SERVICE_DIR: operations-service
        SERVICE_BIN: e-posyandu-operations-service
    image: ${OPERATIONS_SERVICE_IMAGE:-e-posyandu-operations-service:oracle}
    restart: unless-stopped
    env_file:
      - ${ORACLE_API_VAULT_ENV_FILE:-/run/e-posyandu/oracle-api-vault.env}
    environment:
      OPERATIONS_GRPC_ADDR: ${OPERATIONS_GRPC_ADDR:-unix:///run/e-posyandu/operations.sock}
      ORACLE_API_NATIVE_AUTH_ENABLED: "true"
      ORACLE_API_SESSION_DB_PATH: /var/lib/e-posyandu-api/sessions.sqlite
      ORACLE_API_ENVIRONMENT: production
      TURNSTILE_HOSTNAMES: ${ORACLE_API_TURNSTILE_HOSTNAMES:-eposyandu.app}
      CORS_ORIGINS: ${ORACLE_API_CORS_ORIGINS:-https://eposyandu.app,https://www.eposyandu.app}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      CLOUDFLARE_QUEUE_ID: ${CLOUDFLARE_QUEUE_ID:-}
      ORACLE_DATABASE_POOL_SIZE: ${ORACLE_DATABASE_POOL_SIZE:-5}
      ORACLE_REDIS_URL: redis://redis-cache:6379
      ORACLE_API_NATIVE_READS_ENABLED: "true"
      ORACLE_API_NATIVE_WRITES_ENABLED: "true"
    expose:
      - "50053"
    depends_on:
      - redis-cache
    volumes:
      - /var/lib/e-posyandu/oracle-api:/var/lib/e-posyandu-api:rw,z
      - /var/lib/e-posyandu/grpc:/run/e-posyandu:rw,z
    extra_hosts:
      - "host.containers.internal:10.89.0.1"
      - "host.docker.internal:10.89.0.1"
    networks:
      - default
      - dynamic-cache
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 768m
    cpus: 0.65
    logging:
      driver: journald

  realtime-service:
    build:
      context: ../..
      dockerfile: services/oracle-domain/Dockerfile
      args:
        SERVICE_DIR: realtime-service
        SERVICE_BIN: e-posyandu-realtime-service
    image: ${REALTIME_SERVICE_IMAGE:-e-posyandu-realtime-service:oracle}
    restart: unless-stopped
    env_file:
      - ${ORACLE_API_VAULT_ENV_FILE:-/run/e-posyandu/oracle-api-vault.env}
    environment:
      REALTIME_GRPC_ADDR: ${REALTIME_GRPC_ADDR:-unix:///run/e-posyandu/realtime.sock}
      ORACLE_API_NATIVE_AUTH_ENABLED: "true"
      ORACLE_API_SESSION_DB_PATH: /var/lib/e-posyandu-api/sessions.sqlite
      ORACLE_API_ENVIRONMENT: production
      TURNSTILE_HOSTNAMES: ${ORACLE_API_TURNSTILE_HOSTNAMES:-eposyandu.app}
      CORS_ORIGINS: ${ORACLE_API_CORS_ORIGINS:-https://eposyandu.app,https://www.eposyandu.app}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      CLOUDFLARE_QUEUE_ID: ${CLOUDFLARE_QUEUE_ID:-}
      ORACLE_DATABASE_POOL_SIZE: ${ORACLE_DATABASE_POOL_SIZE:-5}
    expose:
      - "50054"
    volumes:
      - /var/lib/e-posyandu/oracle-api:/var/lib/e-posyandu-api:rw,z
      - /var/lib/e-posyandu/grpc:/run/e-posyandu:rw,z
    networks:
      - default
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 384m
    cpus: 0.25
    logging:
      driver: journald

  monitoring-service:
    build:
      context: ../..
      dockerfile: services/oracle-domain/Dockerfile
      args:
        SERVICE_DIR: monitoring-service
        SERVICE_BIN: e-posyandu-monitoring-service
    image: ${MONITORING_SERVICE_IMAGE:-e-posyandu-monitoring-service:oracle}
    restart: unless-stopped
    env_file:
      - ${ORACLE_API_VAULT_ENV_FILE:-/run/e-posyandu/oracle-api-vault.env}
    environment:
      MONITORING_GRPC_ADDR: ${MONITORING_GRPC_ADDR:-unix:///run/e-posyandu/monitoring.sock}
      ORACLE_API_NATIVE_AUTH_ENABLED: "true"
      ORACLE_API_SESSION_DB_PATH: /var/lib/e-posyandu-api/sessions.sqlite
      ORACLE_API_ENVIRONMENT: production
      TURNSTILE_HOSTNAMES: ${ORACLE_API_TURNSTILE_HOSTNAMES:-eposyandu.app}
      CORS_ORIGINS: ${ORACLE_API_CORS_ORIGINS:-https://eposyandu.app,https://www.eposyandu.app}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      CLOUDFLARE_QUEUE_ID: ${CLOUDFLARE_QUEUE_ID:-}
      ORACLE_DATABASE_POOL_SIZE: ${ORACLE_DATABASE_POOL_SIZE:-5}
      ORACLE_REDIS_URL: redis://redis-cache:6379
      ORACLE_API_NATIVE_READS_ENABLED: "true"
      ORACLE_API_NATIVE_WRITES_ENABLED: "true"
    expose:
      - "50055"
    depends_on:
      - redis-cache
    volumes:
      - /var/lib/e-posyandu/oracle-api:/var/lib/e-posyandu-api:rw,z
      - /var/lib/e-posyandu/grpc:/run/e-posyandu:rw,z
    extra_hosts:
      - "host.containers.internal:10.89.0.1"
      - "host.docker.internal:10.89.0.1"
    networks:
      - default
      - dynamic-cache
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    cpus: 0.3
    logging:
      driver: journald

  oracle-api:
    build:
      context: ../..
      dockerfile: services/oracle-api/Dockerfile
    image: ${ORACLE_API_IMAGE:-e-posyandu-oracle-api:oracle}
    restart: unless-stopped
    env_file:
      - ${ORACLE_API_VAULT_ENV_FILE:-/run/e-posyandu/oracle-api-vault.env}
    environment:
      ORACLE_API_LISTEN_ADDR: 0.0.0.0:8081
      ORACLE_API_ENVIRONMENT: production
      ORACLE_REDIS_URL: redis://redis-cache:6379
      # The gateway must understand Oracle-native browser sessions even while
      # background jobs are still bridged to the legacy Cloudflare Queue API.
      ORACLE_API_NATIVE_AUTH_ENABLED: ${ORACLE_API_NATIVE_AUTH_ENABLED:-true}
      # Job creation/status uses the native API so cookie sessions (including
      # administrator MFA) are not revalidated by the legacy Worker.
      ORACLE_API_NATIVE_READS_ENABLED: ${ORACLE_API_NATIVE_READS_ENABLED:-true}
      ORACLE_API_NATIVE_WRITES_ENABLED: ${ORACLE_API_NATIVE_WRITES_ENABLED:-true}
      ORACLE_DATABASE_POOL_SIZE: ${ORACLE_DATABASE_POOL_SIZE:-5}
      ORACLE_API_SESSION_DB_PATH: /var/lib/e-posyandu-api/sessions.sqlite
      CORS_ORIGINS: ${ORACLE_API_CORS_ORIGINS:-https://eposyandu.app,https://www.eposyandu.app}
      TURNSTILE_HOSTNAMES: ${ORACLE_API_TURNSTILE_HOSTNAMES:-eposyandu.app}
      ORACLE_API_PUBLIC_ORIGIN: ${ORACLE_API_PUBLIC_ORIGIN:-https://api.eposyandu.app}
      ORACLE_API_LEGACY_ORIGIN: ${ORACLE_API_LEGACY_ORIGIN:-https://e-posyandu-api.eposyandu-puskesmas-gumukmas.workers.dev}
      ORACLE_API_DATA_PROCESSING_GRPC_URL: ${ORACLE_API_DATA_PROCESSING_GRPC_URL:-unix:///run/e-posyandu/data-processing.sock}
      ORACLE_API_MICROSERVICES_ENABLED: ${ORACLE_API_MICROSERVICES_ENABLED:-true}
      ORACLE_API_IDENTITY_GRPC_URL: ${ORACLE_API_IDENTITY_GRPC_URL:-unix:///run/e-posyandu/identity.sock}
      ORACLE_API_OPERATIONS_GRPC_URL: ${ORACLE_API_OPERATIONS_GRPC_URL:-unix:///run/e-posyandu/operations.sock}
      ORACLE_API_REALTIME_GRPC_URL: ${ORACLE_API_REALTIME_GRPC_URL:-unix:///run/e-posyandu/realtime.sock}
      ORACLE_API_MONITORING_GRPC_URL: ${ORACLE_API_MONITORING_GRPC_URL:-unix:///run/e-posyandu/monitoring.sock}
      # Production selalu microservices-only. Jalur migration proxy tetap ada
      # di source untuk rollback darurat, tetapi tidak boleh aktif pada gateway
      # saat seluruh domain service sudah dirilis.
      ORACLE_API_MIGRATION_PROXY_ENABLED: "false"
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      CLOUDFLARE_QUEUE_ID: ${CLOUDFLARE_QUEUE_ID:-}
      RUST_LOG: ${ORACLE_API_LOG_LEVEL:-e_posyandu_oracle_api=info,tower_http=info}
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      redis-cache:
        condition: service_healthy
      identity-service:
        condition: service_started
      operations-service:
        condition: service_started
      realtime-service:
        condition: service_started
      monitoring-service:
        condition: service_started
    # Podman memilih gateway dari network terakhir untuk host.containers.internal.
    # Kunci nama host database ke bridge aplikasi tempat PostgreSQL mendengar.
    extra_hosts:
      - "host.containers.internal:10.89.0.1"
      - "host.docker.internal:10.89.0.1"
    networks:
      - default
      - dynamic-cache
    volumes:
      - /var/lib/e-posyandu/oracle-api:/var/lib/e-posyandu-api:rw,z
      - /var/lib/e-posyandu/grpc:/run/e-posyandu:rw,z
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    mem_swappiness: 0
    cpus: 0.35
    logging:
      driver: journald

  redis-cache:
    image: docker.io/library/redis:7.4.10-alpine
    restart: unless-stopped
    user: "999:999"
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - volatile-lru
      - --protected-mode
      - "no"
    expose:
      - "6379"
    networks:
      - dynamic-cache
    read_only: true
    tmpfs:
      - /data:rw,noexec,nosuid,nodev,size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 160m
    mem_swappiness: 0
    cpus: 0.15
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging:
      driver: journald

  data-processing-worker:
    build:
      context: ../..
      dockerfile: services/data-processing-service/Dockerfile
    image: ${DATA_PROCESSING_WORKER_IMAGE:-e-posyandu-data-processing-worker:oracle}
    restart: unless-stopped
    env_file:
      # File lama dipertahankan sebagai alias agar deployment berjalan tanpa
      # downtime; nama service/container aktif tetap data-processing-worker.
      - ${ORACLE_NUTRITION_ENV_FILE:-/etc/e-posyandu/nutrition-grpc.env}
      - ${ORACLE_NUTRITION_VAULT_ENV_FILE:-/run/e-posyandu/nutrition-grpc-vault.env}
    environment:
      # Service satu host memakai UDS. Set DATA_PROCESSING_GRPC_ADDR=host:port bila worker
      # dipindahkan ke server/platform lain.
      DATA_PROCESSING_GRPC_ADDR: ${DATA_PROCESSING_GRPC_ADDR:-unix:///run/e-posyandu/data-processing.sock}
      # WHO, screening risiko, dan deteksi anomali diproses oleh Python.
      # Set false hanya saat melakukan rollout worker sebelum analysis-service.
      ANALYSIS_GRPC_ENABLED: ${ANALYSIS_GRPC_ENABLED:-true}
      ANALYSIS_GRPC_URL: ${ANALYSIS_GRPC_URL:-unix:///run/e-posyandu/analysis.sock}
      PORT: "8080"
      QUEUE_BATCH_SIZE: ${QUEUE_BATCH_SIZE:-2}
      QUEUE_POLL_INTERVAL_MS: ${QUEUE_POLL_INTERVAL_MS:-15000}
      # Native Oracle jobs live in the local PostgreSQL database. The worker
      # calls the HMAC-protected internal bridge on the same Compose network;
      # the legacy Cloudflare origin is no longer used for job status.
      EPOSYANDU_API_URL: ${ORACLE_WORKER_API_URL:-http://oracle-api:8081}
    expose:
      - "8080"
      - "50051"
    read_only: true
    volumes:
      - /var/lib/e-posyandu/grpc:/run/e-posyandu:rw,z
    depends_on:
      - analysis-service
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 2g
    mem_swappiness: 0
    cpus: 0.85
    logging:
      driver: journald

  analysis-service:
    build:
      context: ../..
      dockerfile: services/analysis-service/Dockerfile
    image: ${ANALYSIS_SERVICE_IMAGE:-e-posyandu-analysis-service:oracle}
    restart: unless-stopped
    env_file:
      - ${ORACLE_API_VAULT_ENV_FILE:-/run/e-posyandu/oracle-api-vault.env}
    environment:
      ANALYSIS_GRPC_ADDR: ${ANALYSIS_GRPC_ADDR:-unix:///run/e-posyandu/analysis.sock}
      ANALYSIS_HTTP_PORT: "8082"
      LOG_LEVEL: ${ANALYSIS_LOG_LEVEL:-INFO}
    expose:
      - "8082"
    volumes:
      - /var/lib/e-posyandu/grpc:/run/e-posyandu:rw,z
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 384m
    mem_swappiness: 0
    cpus: 0.25
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8082/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - default
    logging:
      driver: journald

  health-proxy:
    image: docker.io/library/caddy:2.10.2-alpine
    restart: unless-stopped
    depends_on:
      - oracle-api
      - data-processing-worker
    environment:
      ORACLE_HEALTH_SITE: ${ORACLE_HEALTH_SITE:?ORACLE_HEALTH_SITE wajib diisi}
      ORACLE_API_SITE: ${ORACLE_API_SITE:-http://api.invalid}
    ports:
      - "${ORACLE_PUBLIC_BIND:-0.0.0.0}:80:80"
      - "${ORACLE_PUBLIC_BIND:-0.0.0.0}:443:443"
      - "${ORACLE_PUBLIC_BIND:-0.0.0.0}:443:443/udp"
    expose:
      - "8088"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    logging:
      driver: journald

  cloudflare-tunnel:
    image: docker.io/cloudflare/cloudflared:2026.7.2
    profiles:
      - cloudflare-tunnel
    restart: unless-stopped
    depends_on:
      - health-proxy
    command:
      - tunnel
      - --no-autoupdate
      - --loglevel
      - info
      - --metrics
      - 0.0.0.0:2000
      - run
    environment:
      TUNNEL_TOKEN_FILE: /run/secrets/cloudflare-tunnel-token
    ports:
      - "127.0.0.1:2000:2000"
    volumes:
      - /run/e-posyandu/cloudflare-tunnel-token:/run/secrets/cloudflare-tunnel-token:ro,Z
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 128m
    mem_swappiness: 0
    cpus: 0.15
    logging:
      driver: journald

volumes:
  caddy_data:
  caddy_config:

networks:
  default:
    driver: bridge
    ipam:
      config:
        - subnet: 10.89.0.0/24
          gateway: 10.89.0.1
  dynamic-cache:
    driver: bridge
    ipam:
      config:
        - subnet: 10.89.1.0/24
          gateway: 10.89.1.1
