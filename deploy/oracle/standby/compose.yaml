name: e-posyandu-oracle-standby

services:
  postgres:
    image: docker.io/library/postgres:17.7-alpine3.23
    restart: unless-stopped
    environment:
      POSTGRES_DB: eposyandu_standby
      POSTGRES_USER: eposyandu_sync
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --data-checksums
    volumes:
      - standby_data:/var/lib/postgresql/data
      - /run/e-posyandu/standby-container-secrets/postgres-password:/run/secrets/postgres-password:ro,Z
      - /run/e-posyandu/standby-container-secrets/reader-password:/run/secrets/reader-password:ro,Z
      - ./init-reader.sh:/docker-entrypoint-initdb.d/010-init-reader.sh:ro,Z
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
      - /var/run/postgresql:rw,nosuid,nodev,size=16m
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 1536m
    mem_swappiness: 0
    cpus: 0.50
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eposyandu_sync -d eposyandu_standby"]
      interval: 10s
      timeout: 5s
      retries: 12
    logging:
      driver: journald

  standby-task:
    image: docker.io/library/postgres:17.7-alpine3.23
    restart: "no"
    depends_on:
      - postgres
    environment:
      STANDBY_ACTION: ${STANDBY_ACTION:-sync}
      STANDBY_SOURCE_URL_FILE: /run/secrets/source-database-url
      STANDBY_OWNER_PASSWORD_FILE: /run/secrets/postgres-password
      STANDBY_READER_PASSWORD_FILE: /run/secrets/reader-password
      STANDBY_TARGET_HOST: postgres
      STANDBY_TARGET_DB: eposyandu_standby
      STANDBY_TARGET_OWNER: eposyandu_sync
      STANDBY_TARGET_READER: eposyandu_reader
    user: "70:70"
    volumes:
      - /run/e-posyandu/standby-container-secrets/source-database-url:/run/secrets/source-database-url:ro,Z
      - /run/e-posyandu/standby-container-secrets/postgres-password:/run/secrets/postgres-password:ro,Z
      - /run/e-posyandu/standby-container-secrets/reader-password:/run/secrets/reader-password:ro,Z
      - ./sync.sh:/usr/local/bin/eposyandu-standby-task:ro,Z
    entrypoint: ["/usr/local/bin/eposyandu-standby-task"]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=512m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 768m
    mem_swappiness: 0
    cpus: 0.35
    logging:
      driver: journald

volumes:
  standby_data:
